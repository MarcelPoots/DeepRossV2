<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17221f">
    <title>Deep Ross V2</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <p class="eyebrow">A local chess game</p>
            <h1>Deep Ross V2</h1>
            <p class="subtitle">Human vs computer</p>
            <p class="fen-display">
                <span>Current state in FEN:</span>
                <button id="copy-fen" class="copy-fen-button" type="button" aria-label="Copy FEN" title="Copy FEN">
                    <svg aria-hidden="true" viewBox="0 0 16 16">
                        <path d="M5 5.5V3.25A1.25 1.25 0 0 1 6.25 2h6.5A1.25 1.25 0 0 1 14 3.25v6.5A1.25 1.25 0 0 1 12.75 11H10.5M3.25 5h6.5A1.25 1.25 0 0 1 11 6.25v6.5A1.25 1.25 0 0 1 9.75 14h-6.5A1.25 1.25 0 0 1 2 12.75v-6.5A1.25 1.25 0 0 1 3.25 5Z" />
                    </svg>
                </button>
                <code id="current-fen" aria-live="polite"></code>
            </p>
        </header>

        <section class="game" aria-labelledby="board-heading">
            <h2 id="board-heading" class="visually-hidden">Chessboard</h2>
            <div class="game-controls">
                <div class="game-actions">
                    <button id="reset-game" class="reset-button" type="button">Reset</button>
                    <button id="open-fen-dialog" class="reset-button load-fen-button" type="button">
                        Load from FEN
                    </button>
                </div>
                <fieldset class="side-choice">
                    <legend>Who starts?</legend>
                    <label>
                        <input type="radio" name="human-side" value="w" checked>
                        You start
                    </label>
                    <label>
                        <input type="radio" name="human-side" value="b">
                        Computer starts
                    </label>
                </fieldset>
                <label class="difficulty-choice" for="difficulty">
                    Difficulty
                    <select id="difficulty">
                        <option value="random">Random moves</option>
                    </select>
                </label>
            </div>
            <chess-board id="chessboard"></chess-board>
            <p id="board-note" class="board-note" role="status" aria-live="polite">
                Drag a piece to move it, or select a piece and a legal destination.
            </p>
        </section>
    </main>
    <dialog id="promotion-dialog" class="promotion-dialog" aria-labelledby="promotion-heading">
        <form method="dialog">
            <p id="promotion-heading">Choose a promotion piece</p>
            <div id="promotion-choices" class="promotion-choices"></div>
            <button class="promotion-cancel" value="cancel">Cancel</button>
        </form>
    </dialog>
    <dialog id="fen-dialog" class="promotion-dialog fen-dialog" aria-labelledby="fen-heading">
        <form id="fen-form">
            <label id="fen-heading" for="fen-input">Load position from FEN</label>
            <textarea id="fen-input" name="fen" rows="3" required
                placeholder="Paste a complete FEN string"></textarea>
            <p id="fen-error" class="fen-error" role="alert" aria-live="polite"></p>
            <div class="fen-dialog-actions">
                <button class="promotion-cancel" id="cancel-fen-load" type="button">Cancel</button>
                <button class="promotion-cancel" type="submit">Load position</button>
            </div>
        </form>
    </dialog>
    <script src="./main.js" type="module"></script>
</body>
</html>
