<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#17221f">
    <title>Deep Ross V2</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <p class="eyebrow">A local chess game</p>
            <h1>Deep Ross V2</h1>
            <p class="subtitle">Human vs computer</p>
        </header>

        <section class="game" aria-labelledby="board-heading">
            <h2 id="board-heading" class="visually-hidden">Chessboard</h2>
            <div id="chessboard" class="chessboard" role="group" aria-label="Chessboard"></div>
            <p id="board-note" class="board-note" role="status" aria-live="polite">
                Drag a piece to move it, or select a piece and a destination. Legal chess moves are not checked yet.
            </p>
        </section>
    </main>
    <script src="./main.js" type="module"></script>
</body>
</html>
